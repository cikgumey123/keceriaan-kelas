<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Penilaian Keceriaan Kelas SKKM</title>
  <!-- Tailwind CSS & Vue 3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <style>
    *, input, select, textarea, button, table, td, th {
      font-family: -apple-system, BlinkMacSystemFont, "San Francisco", "Helvetica Neue", Helvetica, Arial, sans-serif !important;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: #f5f5f7;
      -webkit-tap-highlight-color: transparent;
    }

    .green-apple-bg {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
    }

    .green-apple-btn {
      background-color: #ffffff;
      color: #28a745;
      transition: all 0.3s ease;
    }
    .green-apple-btn:hover {
      background-color: #f0fdf4;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .apple-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .apple-sidebar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(25px);
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }

    .clean-input {
      border: none !important;
      border-bottom: 2px solid #e2e8f0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      outline: none !important;
      transition: all 0.3s ease;
    }
    .clean-input:focus {
      border-bottom-color: #2563eb !important;
    }

    .scale-pill {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .scale-pill:hover {
      transform: translateY(-2px);
    }
    
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    [v-cloak] { display: none; }
  </style>
</head>
<body class="text-slate-800 antialiased">

<div id="app" v-cloak class="min-h-screen flex flex-col md:flex-row w-full overflow-x-hidden">

  <!-- ========================================== -->
  <!-- LOG IN PAGE (DROPDOWN NAMA GURU + PASSWORD ADMIN SAHAJA) -->
  <!-- ========================================== -->
  <div v-if="!isLoggedIn" class="min-h-screen w-full green-apple-bg flex items-center justify-center p-4">
    <div class="apple-card p-6 md:p-10 rounded-3xl w-full max-w-md shadow-2xl relative overflow-hidden">
      
      <div class="text-center mb-8">
        <div class="w-20 h-20 md:w-24 md:h-24 bg-gradient-to-tr from-green-400 to-emerald-600 rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-lg text-white">
          <span class="text-4xl md:text-5xl">🍃</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-black tracking-tight text-slate-800">SKKM Keceriaan</h1>
        <p class="text-xs md:text-sm font-bold text-slate-400 mt-2 uppercase tracking-widest">Sistem Penilaian Kelas</p>
      </div>

      <div class="space-y-6">
        <!-- DROPDOWN PILIH NAMA GURU -->
        <div>
          <label class="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider block mb-1">Pilih Nama Guru</label>
          <div class="relative">
            <span class="absolute left-2 top-2.5 text-lg">👤</span>
            <select v-model="loginForm.selectedUser" @change="onSelectUser" :disabled="isLoadingData"
                    class="w-full clean-input pl-10 py-2 text-slate-700 font-bold text-base md:text-lg cursor-pointer">
              <option :value="null" disabled>
                {{ isLoadingData ? 'Memuatkan senarai guru...' : '-- Pilih Nama Anda --' }}
              </option>
              <option v-for="(u, idx) in validUsers" :key="idx" :value="u">
                {{ u['Nama Penuh'] }}
              </option>
            </select>
          </div>
        </div>

        <!-- KATA LALUAN (MUNCUL HANYA BILA ADMIN DIPILIH) -->
        <transition name="fade">
          <div v-if="isAdminSelected">
            <label class="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider block mb-1">Kata Laluan Admin</label>
            <div class="relative">
              <span class="absolute left-2 top-2.5 text-lg">🔒</span>
              <input v-model="loginForm.password" @keyup.enter="handleLogin" type="password" placeholder="Masukkan kata laluan"
                     class="w-full clean-input pl-10 py-2 text-slate-700 font-bold text-base md:text-lg">
            </div>
          </div>
        </transition>

        <button @click="handleLogin" :disabled="isLoadingData || !loginForm.selectedUser"
                class="w-full green-apple-btn font-bold py-3 md:py-4 rounded-2xl shadow-lg mt-6 flex items-center justify-center text-sm md:text-base tracking-wide disabled:opacity-50">
          <span class="mr-2">{{ isLoadingData ? '⏳' : '🚪' }}</span>
          {{ isLoadingData ? 'MEMUATKAN DATA...' : 'LOG MASUK' }}
        </button>

        <p v-if="loginError" class="text-rose-500 text-sm font-bold text-center mt-3 bg-rose-50 p-3 rounded-xl border border-rose-200">
          <span class="mr-1">⚠️</span> {{ loginError }}
        </p>
      </div>

      <div class="mt-8 pt-4 border-t border-slate-100 text-center">
        <span class="text-xs md:text-sm text-slate-400 font-medium">Sekolah Kebangsaan Kuala Merah</span>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MAIN APP (STYLE APPLE iOS/macOS) -->
  <!-- ========================================== -->
  <template v-else>
    
    <!-- TOP BAR UNTUK MOBILE SAHAJA -->
    <div class="md:hidden bg-white/95 backdrop-blur-lg fixed top-0 left-0 right-0 z-50 border-b border-slate-200/80 p-4 flex justify-between items-center shadow-sm">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-gradient-to-tr from-green-500 to-emerald-600 rounded-lg flex items-center justify-center text-white text-sm shadow-sm">🍃</div>
        <span class="font-black text-slate-800 tracking-tight text-lg">SKKM</span>
      </div>
      <button @click="isMobileMenuOpen = !isMobileMenuOpen" class="text-xl text-slate-800 focus:outline-none bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center shadow-sm">
        {{ isMobileMenuOpen ? '✖️' : '☰' }}
      </button>
    </div>

    <!-- SIDEBAR NAVIGASI -->
    <div :class="isMobileMenuOpen ? 'fixed inset-0 z-40 bg-white/95 backdrop-blur-xl pt-20 flex flex-col justify-between' : 'hidden'" 
         class="w-full md:w-72 apple-sidebar flex-shrink-0 md:flex flex-col justify-between md:z-20 p-6 md:sticky md:top-0 md:h-screen overflow-y-auto transition-all">
      
      <div>
        <!-- Profile Header -->
        <div class="flex items-center space-x-4 mb-8 bg-slate-100/80 p-3 rounded-2xl border border-slate-200/50">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-green-500 to-emerald-600 flex items-center justify-center text-white shadow-md font-bold text-lg">
            {{ currentUser.NamaPenuh ? currentUser.NamaPenuh.charAt(0) : 'G' }}
          </div>
          <div class="overflow-hidden">
            <h3 class="font-bold text-sm md:text-base text-slate-800 truncate">{{ currentUser.NamaPenuh }}</h3>
            <span class="inline-block px-2 py-0.5 text-[10px] md:text-xs font-black rounded-full uppercase bg-green-100 text-green-700">{{ currentUser.Role }}</span>
          </div>
        </div>

        <!-- MENU UTAMA -->
        <div class="space-y-2">
          <div class="text-xs font-bold text-slate-400 uppercase tracking-widest px-3 mb-2">Menu Utama</div>

          <button @click="navigateMenu('dashboard')" :class="currentMenu === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'text-slate-600 hover:bg-slate-200/50'" class="w-full text-left px-4 py-3 rounded-2xl font-bold transition-all flex items-center space-x-3 text-sm md:text-base">
            <div class="w-8 h-8 rounded-xl bg-blue-500 text-white flex items-center justify-center text-sm shadow-sm">📊</div>
            <span>Dashboard Ranking</span>
          </button>

          <button @click="navigateMenu('penilaian')" :class="currentMenu === 'penilaian' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-500/30' : 'text-slate-600 hover:bg-slate-200/50'" class="w-full text-left px-4 py-3 rounded-2xl font-bold transition-all flex items-center space-x-3 text-sm md:text-base">
            <div class="w-8 h-8 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-sm shadow-sm">📝</div>
            <span>Isi Penilaian</span>
          </button>

          <button @click="navigateMenu('kelasTerbaik')" :class="currentMenu === 'kelasTerbaik' ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/30' : 'text-slate-600 hover:bg-slate-200/50'" class="w-full text-left px-4 py-3 rounded-2xl font-bold transition-all flex items-center space-x-3 text-sm md:text-base">
            <div class="w-8 h-8 rounded-xl bg-amber-500 text-white flex items-center justify-center text-sm shadow-sm">👑</div>
            <span>Kelas Terbaik Tahunan</span>
          </button>

          <!-- MENU ADMIN -->
          <template v-if="currentUser.Role && currentUser.Role.toLowerCase() === 'admin'">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest px-3 pt-6 mb-2">Pengurusan Admin</div>

            <button @click="navigateMenu('rekodKelas')" :class="currentMenu === 'rekodKelas' ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30' : 'text-slate-600 hover:bg-slate-200/50'" class="w-full text-left px-4 py-3 rounded-2xl font-bold transition-all flex items-center space-x-3 text-sm md:text-base">
              <div class="w-8 h-8 rounded-xl bg-purple-500 text-white flex items-center justify-center text-sm shadow-sm">🏫</div>
              <span>Rekod Kelas & Item</span>
            </button>

            <button @click="navigateMenu('perananPengguna')" :class="currentMenu === 'perananPengguna' ? 'bg-orange-600 text-white shadow-lg shadow-orange-500/30' : 'text-slate-600 hover:bg-slate-200/50'" class="w-full text-left px-4 py-3 rounded-2xl font-bold transition-all flex items-center space-x-3 text-sm md:text-base">
              <div class="w-8 h-8 rounded-xl bg-orange-500 text-white flex items-center justify-center text-sm shadow-sm">👥</div>
              <span>Peranan Pengguna</span>
            </button>

            <button @click="navigateMenu('rekodKeseluruhan')" :class="currentMenu === 'rekodKeseluruhan' ? 'bg-rose-600 text-white shadow-lg shadow-rose-500/30' : 'text-slate-600 hover:bg-slate-200/50'" class="w-full text-left px-4 py-3 rounded-2xl font-bold transition-all flex items-center space-x-3 text-sm md:text-base">
              <div class="w-8 h-8 rounded-xl bg-rose-500 text-white flex items-center justify-center text-sm shadow-sm">🗄️</div>
              <span>Rekod Keseluruhan</span>
            </button>

            <button @click="navigateMenu('resetData')" :class="currentMenu === 'resetData' ? 'bg-red-600 text-white shadow-lg shadow-red-500/30' : 'text-slate-600 hover:bg-slate-200/50'" class="w-full text-left px-4 py-3 rounded-2xl font-bold transition-all flex items-center space-x-3 text-sm md:text-base">
              <div class="w-8 h-8 rounded-xl bg-red-600 text-white flex items-center justify-center text-sm shadow-sm">🗑️</div>
              <span>Padam & Reset Tahun</span>
            </button>
          </template>
        </div>
      </div>

      <!-- Log Keluar -->
      <div class="pt-6 mt-6 border-t border-slate-200/60 pb-6">
        <button @click="logout" class="w-full px-4 py-3 bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 rounded-2xl font-bold transition-colors flex items-center justify-center text-sm md:text-base">
          <span class="mr-2">🚪</span> Log Keluar
        </button>
      </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 w-full p-4 md:p-8 pb-32 pt-20 md:pt-8 overflow-x-hidden">

      <!-- MODAL NOTIFIKASI SUKSES -->
      <transition name="fade">
        <div v-if="notification" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
          <div class="apple-card p-6 md:p-8 rounded-3xl text-center max-w-sm w-full shadow-2xl border border-white">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-5 text-3xl md:text-4xl">
              <span>✅</span>
            </div>
            <h3 class="text-xl md:text-2xl font-bold text-slate-800 mb-2">Berjaya Disimpan!</h3>
            <p class="text-sm md:text-base text-slate-500 mb-8 font-medium">{{ notification }}</p>
            <button @click="closeNotification" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 md:py-4 rounded-2xl shadow-md transition-all text-sm md:text-base">
              Seterusnya (Pilih Kelas Lain)
            </button>
          </div>
        </div>
      </transition>

      <!-- MENU 1: DASHBOARD PEMENANG MINGGUAN -->
      <div v-if="currentMenu === 'dashboard'" class="max-w-6xl mx-auto w-full space-y-6">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center apple-card p-6 md:p-8 rounded-3xl">
          <div>
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 flex items-center">
              <span class="mr-2 md:mr-3 text-2xl md:text-3xl">🏆</span> Dashboard Pemenang
            </h2>
            <p class="text-xs md:text-sm text-slate-500 font-bold mt-2">Keputusan Kedudukan Kelas Terbaik Mengikut Minggu (Minggu 1 - 45)</p>
          </div>
          <div class="mt-4 md:mt-0 w-full md:w-72">
            <select v-model="dashboardMinggu" class="w-full bg-slate-100 border-none text-slate-800 rounded-2xl font-bold py-3 md:py-4 px-4 focus:ring-2 focus:ring-blue-500 text-sm md:text-base">
              <option value="" disabled>Pilih Minggu</option>
              <option v-for="w in 45" :key="w" :value="'Minggu ' + w">Minggu {{ w }}</option>
            </select>
          </div>
        </div>

        <div v-if="dashboardMinggu" class="apple-card p-6 md:p-8 rounded-3xl">
          <div v-if="!isAllClassesGraded(dashboardMinggu)" class="text-center py-8 md:py-12">
            <div class="w-16 h-16 md:w-24 md:h-24 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 md:mb-6 text-3xl md:text-4xl">
              <span>🔒</span>
            </div>
            <h3 class="text-xl md:text-2xl font-bold text-rose-600 mb-2 md:mb-3">Ranking Masih Dikunci</h3>
            <p class="text-sm md:text-base text-slate-500 max-w-lg mx-auto">
              Dashboard pemenang hanya akan memaparkan kedudukan selepas penilaian untuk kesemua <span class="font-black text-slate-700">12 kelas</span> lengkap diisi bagi <span class="font-black text-blue-600">{{ dashboardMinggu }}</span>.
            </p>
            
            <div class="mt-6 md:mt-8 flex flex-wrap gap-2 justify-center max-w-3xl mx-auto">
              <span v-for="k in appData.kelas" :key="k['Nama Kelas']" 
                    :class="hasGraded(dashboardMinggu, k['Nama Kelas']) ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-rose-100 text-rose-800 border-rose-300'"
                    class="px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-xs md:text-sm font-bold border flex items-center space-x-1.5 md:space-x-2 shadow-sm">
                <span>{{ hasGraded(dashboardMinggu, k['Nama Kelas']) ? '✅' : '❌' }}</span>
                <span>{{ k['Nama Kelas'] }}</span>
              </span>
            </div>
          </div>

          <div v-else class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
            <div v-for="(rankInfo, index) in top3Ranking(dashboardMinggu)" :key="index" 
                 class="relative p-6 md:p-8 rounded-3xl flex flex-col items-center justify-center text-center overflow-hidden border-2 transition-all transform hover:-translate-y-1 shadow-lg"
                 :class="getRankCardStyle(rankInfo.rank)">
              
              <div class="text-5xl md:text-7xl mb-4 drop-shadow-md">
                <span v-if="rankInfo.rank === 1">🥇</span>
                <span v-else-if="rankInfo.rank === 2">🥈</span>
                <span v-else-if="rankInfo.rank === 3">🥉</span>
              </div>
              
              <h3 class="text-xs md:text-sm font-black uppercase tracking-widest text-slate-500 mb-2">
                {{ rankInfo.classes.length > 1 ? 'Tempat Ke-' + rankInfo.rank + ' (Bersama)' : 'Tempat Ke-' + rankInfo.rank }}
              </h3>
              
              <div class="mt-4 space-y-2 md:space-y-3 w-full">
                <div v-for="kelasName in rankInfo.classes" :key="kelasName" class="bg-white/80 backdrop-blur py-2 px-4 md:py-3 md:px-5 rounded-2xl font-black text-xl md:text-2xl shadow-sm border border-white text-slate-800">
                  {{ kelasName }}
                </div>
              </div>

              <div class="mt-6 inline-block bg-slate-900 text-white px-4 py-1.5 md:px-5 md:py-2 rounded-full text-xs md:text-sm font-black shadow-inner">
                {{ rankInfo.score }} Markah
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- MENU 2: ISI PENILAIAN -->
      <div v-if="currentMenu === 'penilaian'" class="max-w-4xl mx-auto w-full apple-card rounded-3xl shadow-xl border border-white">
        
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-6 md:p-8 text-white text-center rounded-t-3xl">
          <h2 class="text-xl md:text-3xl font-black"><span class="mr-2">📋</span> Borang Penilaian Keceriaan</h2>
          <p class="text-xs md:text-sm text-emerald-100 font-bold mt-2 tracking-wide">{{ currentDate }}</p>
        </div>

        <div class="p-4 md:p-10 space-y-8 md:space-y-10">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
            <div>
              <label class="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-widest block mb-2">Pilih Minggu</label>
              <select v-model="formPenilaian.minggu" class="w-full clean-input text-base md:text-lg font-bold text-slate-800 py-2 md:py-3">
                <option value="Pilih Minggu" disabled>Pilih Minggu</option>
                <option v-for="w in 45" :key="w" :value="'Minggu ' + w">Minggu {{ w }}</option>
              </select>
            </div>

            <div>
              <label class="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-widest block mb-2">Pilih Kelas</label>
              <select v-model="formPenilaian.kelas" class="w-full clean-input text-base md:text-lg font-bold text-slate-800 py-2 md:py-3">
                <option value="" disabled selected>Pilih Kelas</option>
                <option v-for="k in appData.kelas" :key="k['Nama Kelas']" :value="k['Nama Kelas']">{{ k['Nama Kelas'] }}</option>
              </select>
            </div>
          </div>

          <div v-if="formPenilaian.minggu && formPenilaian.minggu !== 'Pilih Minggu'" class="bg-slate-50 p-4 md:p-6 rounded-3xl border border-slate-200/80">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3">
              <span class="text-xs md:text-sm font-black uppercase text-slate-600 tracking-wider"><span class="mr-2">📑</span> Status Tandaan {{ formPenilaian.minggu }}</span>
              <span :class="gradedCount(formPenilaian.minggu) === 12 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'" class="px-4 py-1.5 rounded-full text-xs md:text-sm font-black shadow-sm self-end md:self-auto">
                {{ gradedCount(formPenilaian.minggu) }} / 12 Kelas
              </span>
            </div>

            <div class="flex flex-wrap gap-2">
              <span v-for="k in appData.kelas" :key="k['Nama Kelas']" 
                    :class="hasGraded(formPenilaian.minggu, k['Nama Kelas']) ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-white text-slate-400 border-slate-200'"
                    class="px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl text-xs md:text-sm font-bold border flex items-center space-x-1">
                <span>{{ hasGraded(formPenilaian.minggu, k['Nama Kelas']) ? '✅' : '⚪' }}</span>
                <span>{{ k['Nama Kelas'] }}</span>
              </span>
            </div>

            <div class="mt-4 p-3 md:p-4 rounded-2xl text-xs md:text-sm font-bold text-center shadow-sm" 
                 :class="gradedCount(formPenilaian.minggu) === 12 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700'">
              <span v-if="gradedCount(formPenilaian.minggu) === 12">✅ Kesemua 12 kelas telah siap ditanda!</span>
              <span v-else>⚠️ AMARAN: {{ 12 - gradedCount(formPenilaian.minggu) }} kelas lagi belum ditanda.</span>
            </div>
          </div>

          <div>
            <h4 class="text-xs md:text-sm font-black text-slate-400 uppercase tracking-widest mb-4 md:mb-6 border-b pb-2 md:pb-3">Item Penilaian (Skala 1 Hingga 5)</h4>
            
            <div class="overflow-x-auto pb-4 w-full">
              <table class="w-full text-left border-collapse min-w-[500px]">
                <thead>
                  <tr class="border-b-2 border-slate-200 text-slate-500 text-xs md:text-sm uppercase">
                    <th class="py-3 px-2 md:py-4 md:px-3">Item / Kriteria</th>
                    <th v-for="score in 5" :key="score" class="py-3 px-1 md:py-4 md:px-2 text-center w-12 md:w-16 font-black">{{ score }}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <tr v-for="(item, idx) in appData.items" :key="idx" class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-4 px-2 md:py-5 md:px-3 font-bold text-slate-800 text-sm md:text-lg leading-tight pr-4">
                      {{ idx + 1 }}. {{ item['Nama Item'] }}
                    </td>
                    <td v-for="score in 5" :key="score" class="py-4 px-1 md:py-5 md:px-2 text-center">
                      <label class="scale-pill inline-flex items-center justify-center w-10 h-10 md:w-12 md:h-12 rounded-full border-2 transition-all text-sm md:text-lg font-black"
                             :class="formPenilaian.skorItems[item['Nama Item']] === score ? 'bg-emerald-600 text-white border-emerald-600 shadow-md transform scale-110' : 'bg-white text-slate-400 border-slate-200 hover:border-emerald-300'">

            <span v-if="isResetting" class="mr-2">⏳ Sedang Membuat Salinan & Memadam Data...</span>
            <span v-else>🚀 Buat Salinan GSheet & Padam Data Asal</span>
          </button>
        </div>

        <div v-if="backupResult" class="bg-emerald-50 border-2 border-emerald-300 p-5 md:p-6 rounded-2xl text-center space-y-3">
          <div class="text-3xl">✅</div>
          <h4 class="text-lg md:text-xl font-black text-emerald-900">Proses Selesai! Sistem Sedia Untuk Tahun Baharu</h4>
          <p class="text-xs md:text-sm font-bold text-emerald-700">
            Fail salinan telah disimpan di Google Drive anda dengan nama:<br>
            <span class="font-black text-slate-800">{{ backupResult.backupName }}</span>
          </p>
          <div class="pt-2">
            <a :href="backupResult.backupUrl" target="_blank" class="inline-flex items-center px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md text-sm">
              📂 Buka Google Sheet Salinan (Arkib)
            </a>
          </div>
        </div>

      </div>

    </div>
  </template>

</div>

<script>
  // ============================================================================
  // TAMPAL URL WEB APP GOOGLE APPS SCRIPT ANDA (/exec) DI BAWAH INI:
  // ============================================================================
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDQmIUVcKTlCwoaWWBrt-rPw9g8HfgTDp2-ZYhUmjlNPUWuSwAuAFw8QcGkoBvqVqh/exec';

  const { createApp } = Vue;

  createApp({
    data() {
      return {
        isLoadingData: true,
        isLoggedIn: false,
        isSubmitting: false,
        isResetting: false,
        isMobileMenuOpen: false,
        notification: '',
        currentUser: null,
        currentMenu: 'dashboard',
        
        loginForm: {
          selectedUser: null,
          password: ''
        },
        loginError: '',
        
        dashboardMinggu: '',
        rekodMinggu: '',
        confirmResetText: '',
        backupResult: null,
        
        formPenilaian: {
          minggu: 'Pilih Minggu',
          kelas: '',
          skorItems: {}
        },
        
        appData: {
          users: [],
          kelas: [],
          items: [],
          penilaian: []
        }
      }
    },
    computed: {
      validUsers() {
        return (this.appData.users || []).filter(u => u['Nama Penuh'] && String(u['Nama Penuh']).trim() !== '');
      },
      isAdminSelected() {
        if (!this.loginForm.selectedUser || !this.loginForm.selectedUser['Role']) return false;
        return String(this.loginForm.selectedUser['Role']).trim().toLowerCase() === 'admin';
      },
      currentDate() {
        return new Date().toLocaleDateString('ms-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      },
      groupedRecords() {
        const groups = {};
        this.appData.penilaian.forEach(rec => {
          if (!groups[rec['Minggu']]) groups[rec['Minggu']] = [];
          groups[rec['Minggu']].push(rec);
        });
        
        return Object.keys(groups).sort().reverse().map(key => ({
          minggu: key,
          records: groups[key].sort((a, b) => Number(b['Jumlah Skor']) - Number(a['Jumlah Skor']))
        }));
      },
      filteredGroupedRecords() {
        if (!this.rekodMinggu) return [];
        return this.groupedRecords.filter(g => g.minggu === this.rekodMinggu);
      },

      rankingTahunan() {
        const mingguSah = new Set();
        for (let w = 1; w <= 45; w++) {
          mingguSah.add('Minggu ' + w);
        }

        const stats = {};
        this.appData.kelas.forEach(k => {
          const nama = k['Nama Kelas'];
          if (nama) {
            stats[nama] = { kelas: nama, mingguMap: {} };
          }
        });

        this.appData.penilaian.forEach(r => {
          const nama = r['Kelas'];
          const minggu = r['Minggu'];
          const skor = Number(r['Jumlah Skor']) || 0;
          if (!nama || !minggu || !mingguSah.has(minggu)) return;

          if (!stats[nama]) {
            stats[nama] = { kelas: nama, mingguMap: {} };
          }

          if (!stats[nama].mingguMap[minggu] || skor > stats[nama].mingguMap[minggu]) {
            stats[nama].mingguMap[minggu] = skor;
          }
        });

        const list = Object.values(stats).map(item => {
          let jumlahMarkah = 0;
          let mingguDinilai = 0;

          for (let w = 1; w <= 45; w++) {
            const namaMinggu = 'Minggu ' + w;
            if (item.mingguMap[namaMinggu] !== undefined) {
              jumlahMarkah += item.mingguMap[namaMinggu];
              mingguDinilai++;
            }
          }

          const purata = mingguDinilai > 0 ? (jumlahMarkah / mingguDinilai).toFixed(1) : '0.0';

          return {
            kelas: item.kelas,
            jumlahMarkah,
            mingguDinilai,
            purata
          };
        });

        list.sort((a, b) => b.jumlahMarkah - a.jumlahMarkah || Number(b.purata) - Number(a.purata));

        let currentRank = 1;
        return list.map((item, idx) => {
          if (idx > 0 && item.jumlahMarkah < list[idx - 1].jumlahMarkah) {
            currentRank = idx + 1;
          }
          return {
            ...item,
            rank: item.jumlahMarkah > 0 ? currentRank : '-'
          };
        });
      },

      kelasTerbaikTahunan() {
        const adaMarkah = this.rankingTahunan.filter(x => x.jumlahMarkah > 0);
        if (adaMarkah.length === 0) return null;

        const maxSkor = adaMarkah[0].jumlahMarkah;
        const juaraList = adaMarkah.filter(x => x.jumlahMarkah === maxSkor);

        return {
          skorTertinggi: maxSkor,
          kelasList: juaraList.map(x => x.kelas),
          mingguDinilai: juaraList[0].mingguDinilai,
          purata: juaraList[0].purata
        };
      },

      top3Tahunan() {
        const adaMarkah = this.rankingTahunan.filter(x => x.jumlahMarkah > 0);
        const scoreGroups = {};

        adaMarkah.forEach(item => {
          if (!scoreGroups[item.jumlahMarkah]) scoreGroups[item.jumlahMarkah] = [];
          scoreGroups[item.jumlahMarkah].push(item.kelas);
        });

        const sortedScores = Object.keys(scoreGroups).map(Number).sort((a, b) => b - a);
        const result = [];
        let currentRank = 1;

        for (let i = 0; i < sortedScores.length; i++) {
          if (currentRank > 3) break;
          result.push({
            rank: currentRank,
            score: sortedScores[i],
            classes: scoreGroups[sortedScores[i]]
          });
          currentRank++;
        }
        return result;
      }
    },
    methods: {
      async callGasApi(action, payload = {}) {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, payload })
        });
        return await response.json();
      },

      async fetchData() {
        this.isLoadingData = true;
        try {
          const response = await fetch(SCRIPT_URL);
          const data = await response.json();
          this.appData = data;
        } catch (err) {
          console.error('Gagal memuatkan data:', err);
          this.loginError = 'Gagal menyambung ke pangkalan data Google Sheet. Sila semak SCRIPT_URL.';
        } finally {
          this.isLoadingData = false;
        }
      },

      onSelectUser() {
        this.loginForm.password = '';
        this.loginError = '';
      },

      handleLogin() {
        const u = this.loginForm.selectedUser;
        if (!u) {
          this.loginError = 'Sila pilih nama anda terlebih dahulu.';
          return;
        }

        // Hanya minta dan semak kata laluan jika peranan ialah Admin
        if (this.isAdminSelected) {
          if (!this.loginForm.password) {
            this.loginError = 'Sila masukkan kata laluan Admin.';
            return;
          }
          if (String(u.Password) !== String(this.loginForm.password)) {
            this.loginError = 'Kata laluan Admin tidak sah.';
            return;
          }
        }

        // Guru biasa terus log masuk tanpa kata laluan
        this.currentUser = Object.assign({}, u, { NamaPenuh: u['Nama Penuh'] });
        this.isLoggedIn = true;
        this.loginError = '';
      },

      logout() {
        this.isLoggedIn = false;
        this.currentUser = null;
        this.loginForm = { selectedUser: null, password: '' };
        this.currentMenu = 'dashboard';
        this.isMobileMenuOpen = false;
      },
      navigateMenu(menuName) {
        this.currentMenu = menuName;
        this.isMobileMenuOpen = false;
      },
      kiraJumlahSkor() {
        let total = 0;
        for (let k in this.formPenilaian.skorItems) {
          total += (Number(this.formPenilaian.skorItems[k]) || 0);
        }
        return total;
      },
      hasGraded(minggu, kelasName) {
        return this.appData.penilaian.some(r => r['Minggu'] === minggu && r['Kelas'] === kelasName);
      },
      gradedCount(minggu) {
        const gradedClasses = new Set(this.appData.penilaian.filter(r => r['Minggu'] === minggu).map(r => r['Kelas']));
        return gradedClasses.size;
      },
      isAllClassesGraded(minggu) {
        return this.gradedCount(minggu) >= 12;
      },

      async submitPenilaian() {
        if (!this.formPenilaian.minggu || this.formPenilaian.minggu === 'Pilih Minggu') {
          alert('Sila pilih minggu dahulu!'); return;
        }
        if (!this.formPenilaian.kelas) {
          alert('Sila pilih kelas!'); return;
        }

        this.isSubmitting = true;
        const payload = {
          minggu: this.formPenilaian.minggu,
          kelas: this.formPenilaian.kelas,
          guru: this.currentUser.NamaPenuh,
          jumlahSkor: this.kiraJumlahSkor(),
          skorItems: this.formPenilaian.skorItems
        };

        try {
          await this.callGasApi('savePenilaian', payload);
          this.appData.penilaian.push({
            'Timestamp': new Date().toLocaleString(),
            'Minggu': payload.minggu,
            'Kelas': payload.kelas,
            'Guru Penilai': payload.guru,
            'Jumlah Skor': payload.jumlahSkor
          });
          this.notification = `Penilaian bagi kelas ${payload.kelas} (${payload.minggu}) telah berjaya disimpan.`;
        } catch (err) {
          alert('Ralat menyimpan penilaian: ' + err.message);
        } finally {
          this.isSubmitting = false;
        }
      },

      closeNotification() {
        this.notification = '';
        const selectedMinggu = this.formPenilaian.minggu;
        this.formPenilaian = {
          minggu: selectedMinggu,
          kelas: '',
          skorItems: {}
        };
      },

      top3Ranking(minggu) {
        const recordsForWeek = this.appData.penilaian.filter(r => r['Minggu'] === minggu);
        
        const classMaxScores = {};
        recordsForWeek.forEach(r => {
          let score = Number(r['Jumlah Skor']);
          if (!classMaxScores[r['Kelas']] || score > classMaxScores[r['Kelas']]) {
            classMaxScores[r['Kelas']] = score;
          }
        });

        const scoreGroups = {};
        for (let className in classMaxScores) {
          let s = classMaxScores[className];
          if (!scoreGroups[s]) scoreGroups[s] = [];
          scoreGroups[s].push(className);
        }

        const sortedScores = Object.keys(scoreGroups).map(Number).sort((a, b) => b - a);

        let result = [];
        let currentRank = 1;

        for (let i = 0; i < sortedScores.length; i++) {
          if (currentRank > 3) break;

          result.push({
            rank: currentRank,
            score: sortedScores[i],
            classes: scoreGroups[sortedScores[i]]
          });

          currentRank++;
        }
        return result;
      },
      getRankCardStyle(rank) {
        if (rank === 1) return 'bg-yellow-50/80 border-yellow-300 text-yellow-900';
        if (rank === 2) return 'bg-slate-100/80 border-slate-300 text-slate-800';
        if (rank === 3) return 'bg-amber-50/80 border-amber-300 text-amber-900';
        return '';
      },

      async simpanTetapanKelasItem() {
        try {
          await this.callGasApi('simpanTetapanKelasItem', {
            kelas: this.appData.kelas,
            items: this.appData.items
          });
          alert("Tetapan Kelas & Item Berjaya Disimpan!");
        } catch (err) {
          alert("Ralat menyimpan tetapan: " + err.message);
        }
      },

      async simpanPengguna() {
        try {
          await this.callGasApi('simpanPengguna', this.appData.users);
          alert("Senarai Pengguna Berjaya Disimpan!");
        } catch (err) {
          alert("Ralat menyimpan pengguna: " + err.message);
        }
      },

      async jalankanArkibDanReset() {
        if (this.confirmResetText.trim().toUpperCase() !== 'PADAM') return;

        this.isResetting = true;
        this.backupResult = null;

        try {
          const res = await this.callGasApi('arkibDanResetData');
          this.confirmResetText = '';
          if (res && res.success) {
            this.appData.penilaian = [];
            this.dashboardMinggu = '';
            this.rekodMinggu = '';
            this.backupResult = res;
          } else {
            alert('Ralat: ' + (res.message || 'Gagal membuat salinan.'));
          }
        } catch (err) {
          alert('Ralat semasa membuat salinan/memadam data: ' + err.message);
        } finally {
          this.isResetting = false;
        }
      }
    },
    mounted() {
      this.fetchData();
    }
  }).mount('#app');
</script>
</body>
</html>
